[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ntfy-dispatch"
version = "0.1.0"
description = "Route ntfy messages to registered Python handlers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ntfy-dispatch = "ntfy_dispatch.cli:main"

[project.entry-points.pytest11]
ntfy_dispatch = "ntfy_dispatch.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["ntfy_dispatch", "handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
